name: tapt-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: tapt-api-postgres
    environment:
      POSTGRES_DB: tapt-api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - tapt-api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tapt-api-redis
    ports:
      - "6379:6379"
    volumes:
      - tapt-api_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  tapt-api_postgres_data:
  tapt-api_redis_data:
